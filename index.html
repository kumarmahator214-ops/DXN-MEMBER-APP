<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5cff"><link rel="manifest" href="manifest.json"><title>DXN Member List</title>
<style>
:root{--b:#0b5cff;--bg:#f5f7fb;--line:#e5e9f0;--muted:#687386}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#0b1220}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#071a3b,#0b5cff);color:#fff;display:grid;place-items:center;z-index:9}.s{font-size:clamp(35px,8vw,65px);font-weight:800;animation:p 1.1s ease}@keyframes p{0%{opacity:0;transform:scale(.65)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.app{max-width:1050px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:13px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:900}.sub{font-size:12px;color:var(--muted)}h1{font-size:21px;margin:0 0 3px}.icon{width:45px;height:45px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px}
.search{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;gap:9px}.search input{border:0;outline:0;width:100%;font-size:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:13px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:23px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.head,.row{display:grid;grid-template-columns:60px 1.5fr 1fr 1fr;gap:8px;padding:12px 14px;align-items:center}.head{background:#eef3fb;color:#59657a;font-size:11px;font-weight:700}.row{border-top:1px solid var(--line);font-size:14px}.name{font-weight:700}.sponsor{color:#42516a}.empty{text-align:center;padding:35px;color:var(--muted)}
.panel{position:fixed;inset:0;background:#0007;z-index:5;display:flex;justify-content:flex-end}.drawer{width:min(410px,94vw);height:100%;background:#fff;padding:20px;overflow:auto;animation:sl .2s}.close{float:right;border:0;background:#eef2f8;border-radius:10px;width:38px;height:38px}@keyframes sl{from{transform:translateX(100%)}to{transform:translateX(0)}}.menu{width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;font-size:15px}.drawer h2{margin:0 0 18px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}form input{width:100%;padding:12px;border:1px solid #d9dfeb;border-radius:10px}.submit{width:100%;margin-top:17px;padding:13px;border:0;border-radius:11px;background:var(--b);color:#fff;font-weight:800}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.history{padding-top:8px}.hi{padding:12px 0;border-bottom:1px solid var(--line)}small{color:var(--muted)}
@media(max-width:650px){.head,.row{grid-template-columns:45px 1.4fr 1fr 1fr;padding:10px 8px;font-size:12px}.head{font-size:9px}.app{padding:10px}}
</style></head><body>
<div id="splash"><div class="s">WELCOME TO DXN</div></div>
<div class="app"><header><div class="brand"><div class="logo">DXN</div><div><h1>DXN Member List</h1><div class="sub">Simple member organizer</div></div></div><button class="icon" id="settings">⚙️</button></header>
<div class="search">🔎<input id="q" placeholder="Search name, ID or sponsor code..."></div>
<div class="stats"><div class="stat"><b id="count">0</b><span>Total Members</span></div><div class="stat"><b id="added">0</b><span>Added by You</span></div></div>
<div class="wrap"><div class="head"><div>#</div><div>NAME</div><div>MEMBER ID</div><div>SPONSOR CODE</div></div><div id="list"></div></div></div>

<div class="panel" id="setPanel" style="display:none"><div class="drawer"><button class="close" id="setClose">✕</button><h2>Settings</h2>
<button class="menu" id="addOpen">➕ Add Member</button><button class="menu" id="histOpen">🕘 Check History</button><button class="menu" id="backup">💾 Export Backup</button><button class="menu" id="restore">↩️ Restore Original List</button>
<p><small>This app stores data on this device. It never asks for a DXN password or OTP.</small></p></div></div>

<div class="panel" id="addPanel" style="display:none"><div class="drawer"><button class="close" id="addClose">✕</button><h2>Add Member</h2><form id="form">
<label>Name</label><input id="name" required><label>Member ID Code</label><input id="mid" required inputmode="numeric"><label>Sponsor Code</label><input id="sp" required inputmode="numeric"><button class="submit">Submit</button></form></div></div>

<div class="panel" id="histPanel" style="display:none"><div class="drawer"><button class="close" id="histClose">✕</button><h2>Check History</h2><div id="history" class="history"></div></div></div>

"name": "BARKAT ALI", "sponsor": "993110996"}, {"id": "993136487", "name": "MUSHTARI KHATUN", "sponsor": "993029903"}],esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let members=JSON.parse(localStorage.getItem('dxn_members')||'null')||ORIGINAL.map(x=>({...x})),history=JSON.parse(localStorage.getItem('dxn_history')||'[]');
const $=x=>document.getElementById(x),toast=m=>{$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)};
function save(){localStorage.setItem('dxn_members',JSON.stringify(members));localStorage.setItem('dxn_history',JSON.stringify(history))}
function render(){let q=$('q').value.trim().toLowerCase(),a=members.filter(x=>x.name.toLowerCase().includes(q)||x.id.includes(q)||x.sponsor.includes(q));$('count').textContent=members.length;$('added').textContent=history.length;$('list').innerHTML=a.length?a.map((x,i)=>`<div class="row"><div>${i+1}</div><div class="name">${esc(x.name)}</div><div>${esc(x.id)}</div><div class="sponsor">${esc(x.sponsor)}</div></div>`).join(''):'<div class="empty">No member found.</div>'}
$('q').oninput=render;$('settings').onclick=()=>$('setPanel').style.display='flex';$('setClose').onclick=()=>$('setPanel').style.display='none';
$('addOpen').onclick=()=>{$('setPanel').style.display='none';$('addPanel').style.display='flex'};$('addClose').onclick=()=>$('addPanel').style.display='none';
$('histOpen').onclick=()=>{$('setPanel').style.display='none';$('histPanel').style.display='flex';$('history').innerHTML=history.length?history.map(x=>`<div class="hi"><b>Member Added</b><br>${esc(x.name)}<br><small>ID: ${esc(x.id)} · Sponsor: ${esc(x.sponsor)}<br>${esc(x.time)}</small></div>`).join(''):'<div class="empty">No history yet.</div>'};
$('histClose').onclick=()=>$('histPanel').style.display='none';
